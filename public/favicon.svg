<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    :root {
      --nts-color: #0F172A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --nts-color: #F8FAFC;
      }
    }
    .nts-stroke {
      stroke: var(--nts-color);
    }
    .nts-fill {
      fill: var(--nts-color);
    }
    .nts-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: 1.5px;
      text-anchor: middle;
      fill: var(--nts-color);
    }
  </style>

  <!-- Circular background badge or transparent canvas -->
  <!-- Signature Upper Emblem Arch -->
  <path
    d="M 14,42 A 44,44 0 0,1 86,42"
    class="nts-stroke"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Monogram NTS -->
  <text x="50" y="76" class="nts-text">
    NTS
  </text>
</svg>
